name: Build Buzz 321 Fire APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'fire-app/**'
      - '.github/workflows/build-fire-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: fire-app
        run: gradle assembleDebug

      - name: Rename APK
        run: cp fire-app/app/build/outputs/apk/debug/app-debug.apk Buzz-321-Fire-v1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Buzz-321-Fire-v1
          path: Buzz-321-Fire-v1.apk
          if-no-files-found: error
